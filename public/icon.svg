<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D5FD1" />
      <stop offset="100%" stop-color="#0B3D91" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B3D91" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#grad)" />
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Clipboard shape -->
    <rect x="20" y="30" width="260" height="250" rx="20" fill="#FFFFFF" />
    <!-- Clip on top -->
    <rect x="90" y="15" width="120" height="32" rx="8" fill="#1D5FD1" />
    <circle cx="150" cy="31" r="6" fill="#FFFFFF" />
    <!-- Barcode lines inside -->
    <rect x="50" y="80" width="12" height="60" fill="#0B3D91" rx="2" />
    <rect x="70" y="80" width="6" height="60" fill="#0B3D91" rx="2" />
    <rect x="84" y="80" width="18" height="60" fill="#0B3D91" rx="2" />
    <rect x="110" y="80" width="8" height="60" fill="#0B3D91" rx="2" />
    <rect x="126" y="80" width="14" height="60" fill="#0B3D91" rx="2" />
    <rect x="148" y="80" width="6" height="60" fill="#0B3D91" rx="2" />
    <rect x="162" y="80" width="16" height="60" fill="#0B3D91" rx="2" />
    <!-- Checkmark badge -->
    <circle cx="210" cy="190" r="44" fill="#16A34A" />
    <path d="M194 190 L205 201 L226 179" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Stock pills accent -->
    <rect x="50" y="170" width="100" height="14" rx="7" fill="#E2E8F0" />
    <rect x="50" y="196" width="70" height="14" rx="7" fill="#E2E8F0" />
  </g>
</svg>
